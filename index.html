<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Hanserq</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- SEO -->
  <meta name="description" content="Personal website — daily life, work, interests, and everything in between." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hanserq" />
  <meta property="og:description" content="Personal website — daily life, work, interests, and everything in between." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Skip to content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Playground Physics Context -->
<div id="playground-overlay" class="playground-overlay">
  <div id="playground-canvas-container"></div>
  <div class="playground-timer-ui">
    <div class="timer-label">PLAYGROUND MODE ACTIVE</div>
    <div id="playground-countdown" class="timer-countdown">05:00</div>
    <button onclick="stopPlayground()" class="timer-exit-btn">EXIT CHEAT MODE</button>
  </div>
</div>

<div id="cheat-notification" class="cheat-notification">CHEAT ACTIVATED!</div>

<!-- ═══════════════ NAV ═══════════════ -->
<nav id="main-nav" role="navigation" aria-label="Main navigation">
  <div class="nav-inner">
    <div class="nav-logo" id="nav-logo-link" onclick="navigateTo('home')" style="cursor:pointer;" role="button" tabindex="0" aria-label="Go to home"></div>

    <div class="nav-center">
      <div class="nav-links" role="tablist">
        <a href="#" role="tab" aria-selected="true"  onclick="navigateTo('home');    return false;" id="nav-posts"   class="nav-link nav-link-active">Posts</a>
        <a href="#" role="tab" aria-selected="false" onclick="navigateTo('albums');  return false;" id="nav-albums"  class="nav-link">Albums</a>
        <a href="#" role="tab" aria-selected="false" onclick="navigateTo('about');   return false;" id="nav-about"   class="nav-link">About</a>
        <a href="#" role="tab" aria-selected="false" onclick="navigateTo('hobbies'); return false;" id="nav-hobbies" class="nav-link">Hobbies</a>
        <a href="#" role="tab" aria-selected="false" onclick="navigateTo('work');    return false;" id="nav-work"    class="nav-link">Work</a>
      </div>
    </div>

    <div class="nav-right">
      <input type="text" id="search-input" placeholder="Search posts…" class="search-bar" aria-label="Search posts" />
      <!-- Mobile search trigger (hidden on desktop) -->
      <button id="mobile-search-btn" onclick="openMobileSearch()" aria-label="Search" style="display:none;background:none;border:none;color:var(--text-2);padding:0.4rem;cursor:pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
</nav>

<!-- ═══════════════ MAIN ═══════════════ -->
<main id="main-content">

  <!-- PAGE: Home / Posts (default) -->
  <div id="page-home" class="page-view page-active" role="tabpanel">
    <!-- Profile Hero -->
    <section class="profile-hero" id="profile-hero" aria-label="Profile">
      <div class="profile-cover-layer" id="profile-cover-layer"></div>
      <div class="layout-container profile-hero-inner">
        <div class="avatar" id="avatar-el" aria-label="Profile picture">…</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">Loading…</div>
          <div class="profile-tagline" id="profile-tagline"></div>
          <div class="profile-about-short" id="profile-about-short"></div>
        </div>
      </div>
    </section>

    <div class="layout-container">
      <!-- Album view header (when an album is open) -->
      <section id="album-view-header" style="display: none;" class="album-view-header">
        <button onclick="clearAlbumView()" class="back-btn" aria-label="Back to timeline">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
          Back to timeline
        </button>
        <h2 id="album-view-title"></h2>
        <p id="album-view-desc"></p>
      </section>

      <!-- Posts Feed -->
      <section id="feed" aria-label="Posts feed">
        <div class="section-title" id="feed-title">Posts</div>
        <div id="empty-search" style="display: none;" class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>No posts found.</span>
        </div>
        <div id="posts-container"></div>
        <div id="infinite-loader" class="skeleton-loader-wrap" aria-label="Loading more posts">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- PAGE: Albums -->
  <div id="page-albums" class="page-view" style="display:none;" role="tabpanel">
    <div class="layout-container">
      <section aria-label="Albums">
        <div class="section-title" style="margin-top: 2rem;">Albums</div>
        <div id="albums-container-page" class="albums-grid"></div>
        <div id="albums-empty" class="empty-state" style="display:none;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          <span>No albums yet.</span>
        </div>
      </section>
    </div>
  </div>

  <!-- PAGE: About -->
  <div id="page-about" class="page-view" style="display:none;" role="tabpanel">
    <div class="layout-container">
      <section class="about-section" aria-label="About me">
        <div class="section-title" style="margin-top: 2rem;">About</div>
        <div id="about-content" class="about-content"></div>
      </section>
    </div>
  </div>

  <!-- PAGE: Hobbies -->
  <div id="page-hobbies" class="page-view" style="display:none;" role="tabpanel">
    <div class="layout-container">
      <section aria-label="Hobbies and interests">
        <div class="section-title" style="margin-top: 2rem;">Hobbies &amp; Interests</div>
        <div id="hobbies-container" class="hobbies-grid"></div>
        <div id="hobbies-empty" class="empty-state" style="display:none;">
          <span>No hobbies added yet.</span>
        </div>
      </section>
    </div>
  </div>

  <!-- PAGE: Work -->
  <div id="page-work" class="page-view" style="display:none;" role="tabpanel">
    <div class="layout-container">
      <section aria-label="Work and projects">
        <div class="section-title" style="margin-top: 2rem;">Work</div>
        <div id="portfolio-container-page" class="portfolio-grid"></div>
        <div class="empty-state" id="portfolio-empty-page" style="display:none;">
          <span>No projects yet.</span>
        </div>
      </section>
    </div>
  </div>

</main>

<footer id="footer-name" role="contentinfo">—</footer>

<!-- ═══════════════ POST DETAIL MODAL ═══════════════ -->
<div id="post-modal" class="modal" role="dialog" aria-modal="true" aria-label="Post detail">
  <div class="modal-backdrop" onclick="closeModal()"></div>
  <div class="modal-content" id="modal-content">
    <div class="modal-drag-handle" id="modal-drag-handle"></div>
    <button class="modal-close" onclick="closeModal()" aria-label="Close post">×</button>
    <div class="modal-layout">
      <div class="modal-media-pane" id="modal-media"></div>
      <div class="modal-info-pane" id="modal-info"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>

<!-- Mobile bottom nav -->
<nav class="mobile-bottom-nav" id="mobile-bottom-nav" role="navigation" aria-label="Mobile navigation">
  <button class="mob-tab active" id="mob-posts"   onclick="navigateTo('home')"    aria-label="Posts">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Posts</span>
  </button>
  <button class="mob-tab" id="mob-albums"  onclick="navigateTo('albums')"  aria-label="Albums">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    <span>Albums</span>
  </button>
  <button class="mob-tab" id="mob-about"   onclick="navigateTo('about')"   aria-label="About">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span>About</span>
  </button>
  <button class="mob-tab" id="mob-hobbies" onclick="navigateTo('hobbies')" aria-label="Hobbies">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <span>Hobbies</span>
  </button>
  <button class="mob-tab" id="mob-work"    onclick="navigateTo('work')"    aria-label="Work">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span>Work</span>
  </button>
</nav>

<!-- Mobile search overlay -->
<div class="mobile-search-overlay" id="mobile-search-overlay" onclick="closeMobileSearch()" role="dialog" aria-label="Search">
  <div class="mobile-search-box" onclick="event.stopPropagation()">
    <input type="text" id="mobile-search-input" placeholder="Search posts…" autocomplete="off" aria-label="Search posts" />
    <button class="mobile-search-close" onclick="closeMobileSearch()" aria-label="Close search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

</body>
</html>
